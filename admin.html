<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · EYAI Registrations</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: "Public Sans", sans-serif; background: #f9f9fe; color: #1a1c1f; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="min-h-screen">
  <!-- This page is intentionally NOT linked from the public landing page.
       Open directly: /admin.html -->

  <div id="loginView" class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white border border-[#e2e2e7] rounded-2xl p-8 shadow-sm">
      <p class="text-xs font-bold tracking-widest uppercase text-[#b22c09] mb-2">Admin only</p>
      <h1 class="text-2xl font-extrabold text-[#020026] mb-2">EYAI Dashboard</h1>
      <p class="text-sm text-[#47464e] mb-6">Enter the admin key to view registrations. This page is not linked in the public site.</p>
      <label class="block text-sm font-semibold mb-2" for="adminKey">Admin key</label>
      <input id="adminKey" type="password" class="w-full border border-[#c8c5cf] rounded-xl px-4 py-3 mb-4 outline-none focus:border-[#b22c09]" placeholder="Admin key" />
      <label class="block text-sm font-semibold mb-2" for="apiBase">API base URL</label>
      <input id="apiBase" type="text" class="w-full border border-[#c8c5cf] rounded-xl px-4 py-3 mb-4 outline-none focus:border-[#b22c09]" value="http://localhost:5000" />
      <p id="loginError" class="text-sm text-red-600 mb-3 hidden"></p>
      <button id="loginBtn" class="w-full bg-[#b22c09] text-white font-bold rounded-xl py-3 hover:bg-[#8a1c00]">Open dashboard</button>
    </div>
  </div>

  <div id="dashView" class="hidden min-h-screen">
    <header class="bg-white border-b border-[#e2e2e7] px-6 py-4 flex items-center justify-between">
      <div>
        <p class="text-xs font-bold tracking-widest uppercase text-[#b22c09]">Admin</p>
        <h1 class="text-xl font-extrabold text-[#020026]">Registrations</h1>
      </div>
      <div class="flex items-center gap-3">
        <span id="countBadge" class="text-sm font-semibold text-[#47464e]"></span>
        <button id="refreshBtn" class="px-4 py-2 rounded-xl border border-[#c8c5cf] font-semibold text-sm">Refresh</button>
        <button id="logoutBtn" class="px-4 py-2 rounded-xl bg-[#020026] text-white font-semibold text-sm">Logout</button>
      </div>
    </header>

    <main class="p-6">
      <p id="dashError" class="text-sm text-red-600 mb-4 hidden"></p>
      <div class="bg-white border border-[#e2e2e7] rounded-2xl overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="bg-[#f3f3f8] text-left">
            <tr>
              <th class="px-4 py-3 font-bold">ID</th>
              <th class="px-4 py-3 font-bold">Name</th>
              <th class="px-4 py-3 font-bold">Age</th>
              <th class="px-4 py-3 font-bold">Email</th>
              <th class="px-4 py-3 font-bold">Phone</th>
              <th class="px-4 py-3 font-bold">Region</th>
              <th class="px-4 py-3 font-bold">Category</th>
              <th class="px-4 py-3 font-bold">Course</th>
              <th class="px-4 py-3 font-bold">Mode</th>
              <th class="px-4 py-3 font-bold">Created</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script>
    const loginView = document.getElementById("loginView");
    const dashView = document.getElementById("dashView");
    const loginError = document.getElementById("loginError");
    const dashError = document.getElementById("dashError");
    const rowsEl = document.getElementById("rows");
    const countBadge = document.getElementById("countBadge");

    function getStore() {
      return {
        key: localStorage.getItem("eyai_admin_key") || "",
        api: localStorage.getItem("eyai_api_base") || "http://localhost:5000",
      };
    }

    function setStore(key, api) {
      localStorage.setItem("eyai_admin_key", key);
      localStorage.setItem("eyai_api_base", api);
    }

    function showLogin(msg) {
      loginView.classList.remove("hidden");
      dashView.classList.add("hidden");
      if (msg) {
        loginError.textContent = msg;
        loginError.classList.remove("hidden");
      }
    }

    function showDash() {
      loginView.classList.add("hidden");
      dashView.classList.remove("hidden");
    }

    async function loadRegistrations() {
      const { key, api } = getStore();
      dashError.classList.add("hidden");
      rowsEl.innerHTML = `<tr><td class="px-4 py-6" colspan="10">Loading…</td></tr>`;

      try {
        const res = await fetch(`${api}/api/admin/registrations`, {
          headers: { "x-admin-key": key },
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.message || "Failed to load");

        countBadge.textContent = `${data.count} registrations`;
        if (!data.data.length) {
          rowsEl.innerHTML = `<tr><td class="px-4 py-6" colspan="10">No registrations yet.</td></tr>`;
          return;
        }

        rowsEl.innerHTML = data.data.map((r) => `
          <tr class="border-t border-[#e2e2e7] align-top">
            <td class="px-4 py-3">${r.id}</td>
            <td class="px-4 py-3 font-semibold">${r.fullName || ""}</td>
            <td class="px-4 py-3">${r.age ?? ""}</td>
            <td class="px-4 py-3">${r.email || ""}</td>
            <td class="px-4 py-3">${r.phone || ""}</td>
            <td class="px-4 py-3">${r.region || ""}</td>
            <td class="px-4 py-3">${r.category || ""}</td>
            <td class="px-4 py-3">${r.course || ""}</td>
            <td class="px-4 py-3">${r.mode || ""}</td>
            <td class="px-4 py-3">${r.createdAt ? new Date(r.createdAt).toLocaleString() : ""}</td>
          </tr>
        `).join("");
      } catch (err) {
        rowsEl.innerHTML = "";
        dashError.textContent = err.message || "Error loading data";
        dashError.classList.remove("hidden");
        if (String(err.message).toLowerCase().includes("denied") || String(err.message).toLowerCase().includes("invalid")) {
          localStorage.removeItem("eyai_admin_key");
          showLogin(err.message);
        }
      }
    }

    document.getElementById("loginBtn").addEventListener("click", async () => {
      const key = document.getElementById("adminKey").value.trim();
      const api = document.getElementById("apiBase").value.trim().replace(/\/$/, "");
      loginError.classList.add("hidden");
      if (!key) {
        loginError.textContent = "Admin key is required.";
        loginError.classList.remove("hidden");
        return;
      }
      try {
        const res = await fetch(`${api}/api/admin/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ adminKey: key }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.message || "Login failed");
        setStore(key, api);
        showDash();
        loadRegistrations();
      } catch (err) {
        loginError.textContent = err.message || "Login failed";
        loginError.classList.remove("hidden");
      }
    });

    document.getElementById("refreshBtn").addEventListener("click", loadRegistrations);
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("eyai_admin_key");
      showLogin();
    });

    // Auto-enter dashboard if already logged in
    const saved = getStore();
    document.getElementById("apiBase").value = saved.api;
    if (saved.key) {
      showDash();
      loadRegistrations();
    }
  </script>
</body>
</html>
